<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under Construction</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #e2e8f0;
      }

      .card {
        text-align: center;
        padding: 3rem 2.5rem;
        max-width: 480px;
        width: 90%;
      }

      .icon {
        font-size: 3.5rem;
        margin-bottom: 1.5rem;
        display: block;
      }

      h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: #f8fafc;
        margin-bottom: 0.75rem;
        letter-spacing: -0.3px;
      }

      p {
        font-size: 1rem;
        color: #94a3b8;
        line-height: 1.6;
      }

      .divider {
        width: 48px;
        height: 3px;
        background: #3b82f6;
        border-radius: 2px;
        margin: 1.5rem auto;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.3);
        color: #93c5fd;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.35rem 0.9rem;
        border-radius: 999px;
        margin-top: 1.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .dot {
        width: 7px;
        height: 7px;
        background: #3b82f6;
        border-radius: 50%;
        animation: pulse 1.6s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.3; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="icon">🔧</span>
      <h1>Under Construction</h1>
      <div class="divider"></div>
      <p>We are currently performing maintenance and updates. The site will be back up shortly.</p>
      <div class="status">
        <span class="dot"></span>
        In Progress
      </div>
    </div>
  </body>
</html>
